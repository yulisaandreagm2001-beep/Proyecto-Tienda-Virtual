<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Admin - Listado de Productos</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body id="page-top">
    <div id="wrapper">
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="index.html">
                <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-laugh-wink"></i></div>
                <div class="sidebar-brand-text mx-3">Inventario</div>
            </a>
            <hr class="sidebar-divider my-0">
            <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-fw fa-tachometer-alt"></i><span>Dashboard</span></a></li>
            <hr class="sidebar-divider">
            <li class="nav-item active">
                <a class="nav-link" href="#" data-toggle="collapse" data-target="#collapseProductos">
                    <i class="fas fa-fw fa-box"></i><span>Productos</span>
                </a>
                <div id="collapseProductos" class="collapse show">
                    <div class="bg-white py-2 collapse-inner rounded">
                        <a class="collapse-item active" href="listado-pro.html">Ver Productos</a>
                        <a class="collapse-item" href="crear-pro.html">Crear Productos</a>
                    </div>
                </div>
            </li>
        </ul>

        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                    <h1 class="h4 mb-0 text-gray-800 ml-4">Gestión de Inventario</h1>
                </nav>

                <div class="container-fluid">
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">Listado de Productos</h1>
                        <div>
                            <span id="rol-badge" class="badge badge-info mr-2 p-2">Rol: Cargando...</span>
                            <a href="crear-pro.html" class="btn btn-sm btn-success shadow-sm">
                                <i class="fas fa-plus fa-sm text-white-50"></i> Agregar Nuevo
                            </a>
                        </div>
                    </div>

                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text bg-primary text-white"><i class="fas fa-search"></i></span>
                                </div>
                                <input type="text" id="buscador" class="form-control" placeholder="Buscar por nombre de producto o descripción...">
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="tablaProductos" width="100%" cellspacing="0">
                                    <thead class="thead-light">
                                        <tr>
                                            <th>Imagen</th>
                                            <th>Producto</th>
                                            <th>Descripción</th>
                                            <th>Precio</th>
                                            <th>Stock</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="lista-productos-body">
                                        </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto"><span>Copyright &copy; Tu Inventario 2026</span></div>
                </div>
            </footer>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
    <script src="js/sb-admin-2.min.js"></script>

   <script>
    // 1. CONFIGURACIÓN GLOBAL
    const API_URL = "http://localhost:3000/api/productos";
    const tbody = document.querySelector('#lista-productos-body');
    const inputBuscador = document.querySelector('#buscador');
    const badgeRol = document.querySelector('#rol-badge');

    // 2. GESTIÓN DE USUARIO Y ROL
    // Intentamos obtener el usuario del localStorage. 
    // Si no existe (null), creamos uno por defecto como 'admin' para que te funcione el botón.
    let usuarioActual = JSON.parse(localStorage.getItem("usuario"));

    if (!usuarioActual) {
        usuarioActual = {
            nombre: "Douglas McGee",
            rol: "admin" // Cambia a 'vendedor' para probar la restricción
        };
        localStorage.setItem("usuario", JSON.stringify(usuarioActual));
    }

    // 3. ACTUALIZAR INTERFAZ (Badge de Rol)
    if (badgeRol) {
        badgeRol.textContent = `Rol: ${usuarioActual.rol.toUpperCase()}`;
        // Cambiamos el color según el privilegio
        if (usuarioActual.rol.toLowerCase() === 'admin') {
            badgeRol.className = "badge badge-danger mr-2 p-2"; // Rojo para Admin
        } else {
            badgeRol.className = "badge badge-info mr-2 p-2";   // Azul para Vendedor
        }
    }

    let productosLocal = []; // Para el buscador sin peticiones extra

    // 4. OBTENER DATOS DE LA API
    async function obtenerProductos() {
        try {
            const respuesta = await fetch(API_URL);
            if (!respuesta.ok) throw new Error("Error en servidor");
            
            productosLocal = await respuesta.json();
            renderizarTabla(productosLocal);
        } catch (error) {
            console.error("Error:", error);
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">⚠️ Error de conexión con el servidor</td></tr>`;
        }
    }

    // 5. RENDERIZAR TABLA (Aquí se decide si el botón se bloquea o no)
    function renderizarTabla(lista) {
        tbody.innerHTML = ""; 

        if (lista.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center">No se encontraron productos</td></tr>`;
            return;
        }

        lista.forEach(p => {
            const fila = document.createElement('tr');
            
            // VALIDACIÓN DE ROL PARA EL BOTÓN
            const esAdmin = usuarioActual.rol.toLowerCase() === 'admin';
            
            const btnEliminar = esAdmin 
                ? `<button class="btn btn-danger btn-sm" onclick="eliminarProducto(${p.id})">
                        <i class="fas fa-trash"></i>
                   </button>`
                : `<button class="btn btn-secondary btn-sm" disabled title="Acceso restringido a Vendedores">
                        <i class="fas fa-trash"></i>
                   </button>`;

            fila.innerHTML = `
                <td class="text-center">
                    <img src="${p.imagen}" style="width:40px; height:40px; object-fit:cover;" class="rounded shadow-sm">
                </td>
                <td class="font-weight-bold">${p.nombre}</td>
                <td>${p.descripcion || ''}</td>
                <td>$${Number(p.precio).toLocaleString()}</td>
                <td class="text-center">
                    <span class="badge ${p.stock > 5 ? 'badge-success' : 'badge-danger'}">${p.stock}</span>
                </td>
                <td>
                    <a href="crear-pro.html?id=${p.id}" class="btn btn-info btn-sm">
                        <i class="fas fa-edit"></i>
                    </a>
                    ${btnEliminar}
                </td>
            `;
            tbody.appendChild(fila);
        });
    }

    // 6. BUSCADOR DINÁMICO
    inputBuscador.addEventListener('input', (e) => {
        const texto = e.target.value.toLowerCase();
        const filtrados = productosLocal.filter(p => 
            p.nombre.toLowerCase().includes(texto) || 
            (p.descripcion && p.descripcion.toLowerCase().includes(texto))
        );
        renderizarTabla(filtrados);
    });

    // 7. FUNCIÓN ELIMINAR (Protegida)
    async function eliminarProducto(id) {
        if (usuarioActual.rol.toLowerCase() !== 'admin') {
            alert("⛔ No tienes permisos para realizar esta acción.");
            return;
        }

        if (confirm("¿Estás seguro de que deseas eliminar este producto?")) {
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert("✅ Producto eliminado con éxito");
                    obtenerProductos();
                } else {
                    alert("❌ Error al eliminar el producto");
                }
            } catch (e) {
                alert("❌ Error de comunicación con el servidor");
            }
        }
    }

    // Inicializar carga
    document.addEventListener('DOMContentLoaded', obtenerProductos);
</script>
       
</body>
</html>
